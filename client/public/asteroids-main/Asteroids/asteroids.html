<!DOCTYPE html>
<html>
    <head>
        <script type="text/javascript" src="./Common/webgl-utils.js"></script>
        <script type="text/javascript" src="./Common/initShaders.js"></script>
        <script type="text/javascript" src="./Common/MV.js"></script>
        <script type="text/javascript" src="asteroid.js"></script>
        <script type="text/javascript" src="player.js"></script>
        <script type="text/javascript" src="bullet.js"></script>
        <script type="text/javascript" src="game.js"></script>
        <script type="text/javascript" src="characters.js"></script>
        <audio id="shootSound" src="./Sounds/shoot.mp3" preload="auto"></audio>
        <audio id="explodeSound" src="./Sounds/explode.mp3" preload="auto"></audio>
        <audio id="deathSound" src="./Sounds/death.mp3" preload="auto"></audio>

        <script id="vertex-shader" type="x-shader/x-vertex">
            attribute vec4 myPosition;

            void main(){
                gl_PointSize = 1.0;
                gl_Position = myPosition;
            }
        </script>

        <script id="frag-asteroid" type="x-shader/x-fragment">
            uniform bool destroyed;

            void main(){
                if (!destroyed)
                    gl_FragColor = vec4( 1.0, 1.0, 1.0, 1.0 );
                else
                    gl_FragColor = vec4( 0.0, 1.0, 1.0, 1.0 );
            }
        </script>

        <script id="frag-player" type="x-shader/x-fragment">
            void main(){
                gl_FragColor = vec4( 1.0, 0.0, 1.0, 1.0 );
            }
        </script>

        <script id="frag-orange" type="x-shader/x-fragment">
            void main(){
                gl_FragColor = vec4( 255.0/255.0, 145.0/255.0, 0.0/255.0, 1.0 );
            }
        </script>

        <script id="frag-menu" type="x-shader/x-fragment">
            uniform bool clicked;

            void main(){
                if (!clicked)
                    gl_FragColor = vec4( 1.0, 0.0, 1.0, 1.0 );
                else
                    gl_FragColor = vec4( 1.0, 1.0, 1.0, 1.0 );
            }
        </script>
    </head>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            width: 100%;
            overflow: hidden;
            background: transparent !important;
            box-sizing: border-box;
        }
        body {
            position: relative;
            width: 100vw;
            height: 100vh;
            min-width: 100%;
            min-height: 100%;
        }
        #asteroids-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            margin: 0;
            padding: 0;
            background: transparent !important;
            border: none;
        }
    </style>
    <body onload="init(); resizeAsteroidsCanvas();" style="overflow: hidden;">
        <canvas id="asteroids-canvas"></canvas>
        <script>
            function resizeAsteroidsCanvas() {
                var canvas = document.getElementById('asteroids-canvas');
                if (!canvas) return;
                const dpr = window.devicePixelRatio || 1;
                const width = canvas.offsetWidth;
                const height = canvas.offsetHeight;
                if (canvas.width !== width * dpr || canvas.height !== height * dpr) {
                    canvas.width = width * dpr;
                    canvas.height = height * dpr;
                }
            }
            window.addEventListener('resize', resizeAsteroidsCanvas);
            window.addEventListener('DOMContentLoaded', resizeAsteroidsCanvas);
            setTimeout(resizeAsteroidsCanvas, 100);
        </script>
    </body>
</html>
