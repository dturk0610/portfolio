<style>
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        width: 100%;
        overflow: hidden;
        background: transparent !important;
        box-sizing: border-box;
    }
    body {
        position: relative;
        width: 100vw;
        height: 100vh;
        min-width: 100%;
        min-height: 100%;
    }
    #gl-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        margin: 0;
        padding: 0;
        background: transparent !important;
        border: none;
    }
</style>
<body onload="init(); resizeCanvas();" style="overflow: hidden;">
    <canvas id="gl-canvas"><!-- Responsive canvas --></canvas>
    <script>
        function resizeCanvas() {
            var canvas = document.getElementById('gl-canvas');
            if (!canvas) return;
            // Set drawing buffer size to match displayed size
            const dpr = window.devicePixelRatio || 1;
            const width = canvas.offsetWidth;
            const height = canvas.offsetHeight;
            if (canvas.width !== width * dpr || canvas.height !== height * dpr) {
                canvas.width = width * dpr;
                canvas.height = height * dpr;
            }
        }
        window.addEventListener('resize', resizeCanvas);
        // Also resize after DOM is ready and after a short delay (for iframe loads)
        window.addEventListener('DOMContentLoaded', resizeCanvas);
        setTimeout(resizeCanvas, 100);
    </script>
</body>

</html>
